<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AESTHETIC DREAM ✨</title>
  
  <meta property="og:title" content="A Little Dream For You 🌸✨">
  <meta property="og:description" content="Khám phá 10 chuyển động ánh sáng pastel dịu dàng, lãng mạn và tinh tế.">
  <meta property="og:image" content="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=1200&q=80">
  <meta property="og:type" content="website">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #060208;
      font-family: -apple-system, BlinkMacSystemFont, "Didot", "Playfair Display", "Cinzel", serif;
      cursor: none;
    }

    /* Ambient Silk Glow */
    .ambient-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 175, 195, 0.13) 0%, rgba(230, 205, 255, 0.05) 50%, rgba(6, 2, 8, 0.98) 85%);
      z-index: 0;
      pointer-events: none;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #overlay-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Minimalist Elegant Cursor */
    #cursor-follower {
      position: fixed;
      top: 0;
      left: 0;
      width: 28px;
      height: 28px;
      margin-left: -14px;
      margin-top: -14px;
      border-radius: 50%;
      border: 1px solid rgba(255, 195, 210, 0.7);
      background: radial-gradient(circle, rgba(255, 195, 210, 0.25) 0%, rgba(235, 210, 255, 0.04) 70%, transparent 100%);
      box-shadow: 0 0 18px rgba(255, 160, 185, 0.5), 0 0 35px rgba(230, 200, 255, 0.25);
      pointer-events: none;
      z-index: 99;
      transform: translate3d(-100px, -100px, 0);
    }

    #cursor-dot {
      position: fixed;
      top: 0;
      left: 0;
      width: 4px;
      height: 4px;
      margin-left: -2px;
      margin-top: -2px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px #ffb3c6, 0 0 18px #fff;
      pointer-events: none;
      z-index: 100;
      transform: translate3d(-100px, -100px, 0);
    }

    /* Aesthetic Minimalist Start Overlay */
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, rgba(20, 6, 24, 0.9) 0%, rgba(6, 2, 8, 0.98) 78%);
      backdrop-filter: blur(24px);
      transition: opacity 1.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 1.4s;
      cursor: pointer;
    }
    #start-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .shimmer-center {
      position: relative;
      width: 100px;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }

    .shimmer-halo {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1px solid rgba(255, 195, 210, 0.5);
      box-shadow: 0 0 25px rgba(255, 175, 195, 0.35);
      animation: gentleRipple 3.6s infinite ease-out;
    }
    .shimmer-halo:nth-child(2) {
      animation-delay: 1.8s;
      border-color: rgba(230, 205, 255, 0.4);
    }

    @keyframes gentleRipple {
      0% { transform: scale(0.7); opacity: 0.8; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    .pearl-icon {
      font-size: 32px;
      animation: breatheIcon 3s infinite ease-in-out;
      filter: drop-shadow(0 0 20px rgba(255, 185, 205, 0.9));
    }

    @keyframes breatheIcon {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .start-title {
      color: rgba(255, 240, 245, 0.9);
      font-size: 0.95rem;
      letter-spacing: 7px;
      text-transform: uppercase;
      font-weight: 300;
      text-shadow: 0 0 15px rgba(255, 185, 205, 0.7);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div class="ambient-glow"></div>

  <!-- Minimalist Custom Cursor -->
  <div id="cursor-follower"></div>
  <div id="cursor-dot"></div>

  <!-- Canvases (Zero Clutter, Zero Text) -->
  <canvas id="webgl-canvas"></canvas>
  <canvas id="overlay-canvas"></canvas>

  <!-- Clean Start Screen -->
  <div id="start-screen">
    <div class="shimmer-center">
      <div class="shimmer-halo"></div>
      <div class="shimmer-halo"></div>
      <div class="pearl-icon">✧</div>
    </div>
    <div class="start-title">CHẠM ĐỂ MỞ</div>
  </div>

  <script>
    /* =====================================================================
       SILKY MOUSE TRACKING
       ===================================================================== */
    const mouse = {
      x: 0,
      y: 0,
      targetX: 0,
      targetY: 0,
      screenX: window.innerWidth / 2,
      screenY: window.innerHeight / 2,
      targetScreenX: window.innerWidth / 2,
      targetScreenY: window.innerHeight / 2
    };

    const cursorFollower = document.getElementById('cursor-follower');
    const cursorDot = document.getElementById('cursor-dot');

    function onPointerMove(clientX, clientY) {
      mouse.targetScreenX = clientX;
      mouse.targetScreenY = clientY;
      mouse.targetX = (clientX / window.innerWidth) * 2 - 1;
      mouse.targetY = -(clientY / window.innerHeight) * 2 + 1;

      // Spawn soft fairy stardust
      if (Math.random() > 0.3) {
        spawnFairySpark(clientX, clientY);
      }
    }

    window.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    /* =====================================================================
       ETHEREAL MUSIC BOX & AMBIENT HARP
       ===================================================================== */
    class AmbientAudio {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        // French impressionist warm chords (Debussy/Ravel aesthetic)
        this.notes = [261.63, 329.63, 392.00, 493.88, 587.33, 659.25, 783.99, 987.77];
        this.step = 0;
      }

      init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.isPlaying = true;
        this.loop();
      }

      playBell(freq, time) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, time);

        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(0.038, time + 0.06);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 3.8);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(time);
        osc.stop(time + 3.8);
      }

      loop() {
        if (!this.isPlaying) return;
        const now = this.ctx.currentTime;
        const pattern = [0, 2, 4, 3, 5, 4, 6, 7];
        const note = this.notes[pattern[this.step % pattern.length]];
        
        this.playBell(note, now);
        if (this.step % 4 === 0) {
          this.playBell(note * 0.5, now, 4.5); // Warm bass foundation
        }

        this.step++;
        setTimeout(() => this.loop(), 680);
      }
    }
    const audio = new AmbientAudio();

    /* =====================================================================
       THREE.JS: 7,200 HIGH-DEFINITION STARDUST PARTICLES (ZERO LAG)
       ===================================================================== */
    const PARTICLE_COUNT = 7200;
    const canvas3D = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({
      canvas: canvas3D,
      antialias: true,
      alpha: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.z = 280;

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);

    for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 350;
      colors[i] = 1.0;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    // Refined Soft Starlight Texture
    function createStarlightTexture() {
      const c = document.createElement('canvas');
      c.width = 64;
      c.height = 64;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.2, 'rgba(255, 200, 218, 0.95)');
      grad.addColorStop(0.5, 'rgba(235, 210, 255, 0.4)');
      grad.addColorStop(0.8, 'rgba(255, 175, 195, 0.1)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }

    const material = new THREE.PointsMaterial({
      size: 6.2,
      map: createStarlightTexture(),
      vertexColors: true,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    /* =====================================================================
       10 ELEGANT, DREAMY SHAPES (CURATED FOR WOMEN / HIGH AESTHETIC TASTE)
       ===================================================================== */
    const shapes = [];

    // Helper to push precomputed shape
    function addShape(fn) {
      const arr = new Float32Array(PARTICLE_COUNT * 3);
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = fn(i, i / PARTICLE_COUNT);
        const i3 = i * 3;
        arr[i3] = p[0];
        arr[i3 + 1] = p[1];
        arr[i3 + 2] = p[2];
      }
      shapes.push(arr);
    }

    // 1. Crystal Volumetric Heart (Trái Tim Pha Lê Trong Suốt)
    addShape((i, f) => {
      const t = Math.PI * 2 * f;
      const r = Math.pow(Math.random(), 0.55);
      const u = (Math.random() - 0.5) * Math.PI;
      const x = 16 * Math.pow(Math.sin(t), 3) * 8.4 * r;
      const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * 8.4 * r;
      const z = u * 15 * (1.1 - Math.abs(x) / 32);
      return [x, y, z];
    });

    // 2. Blooming French Peony / Rose (Đóa Hoa Mẫu Đơn Pháp Nở Xòe)
    addShape((i, f) => {
      const theta = i * 2.39996; // Golden spiral
      const radius = Math.sqrt(f) * 175;
      const petalWave = Math.sin(theta * 5) * 16;
      const z = Math.pow(f, 1.25) * 85 - 40 + petalWave;
      const r = radius + petalWave * 0.45;
      return [r * Math.cos(theta), r * Math.sin(theta), z];
    });

    // 3. Ethereal Butterfly Wings (Cánh Bướm Dạ Quang Đập Nhẹ)
    addShape((i, f) => {
      const t = f * Math.PI * 2;
      // Elegant butterfly curve
      const r = (Math.exp(Math.cos(t)) - 2 * Math.cos(4 * t) - Math.pow(Math.sin(t / 12), 5)) * 44;
      const x = r * Math.sin(t) * 0.95;
      const y = r * Math.cos(t) * 0.95;
      const z = Math.abs(x) * 0.35 + (Math.random() - 0.5) * 12; // Gentle V wing depth
      return [x, y, z];
    });

    // 4. Lily of the Valley Bells (Đóa Hoa Linh Lan / Chuông Tiên Rủ Nhẹ)
    addShape((i, f) => {
      if (f < 0.28) {
        // Arching delicate stem
        const t = (f / 0.28) * Math.PI * 0.9;
        const x = Math.cos(t) * 140 - 50;
        const y = Math.sin(t) * 130 - 30;
        const z = (Math.random() - 0.5) * 8;
        return [x, y, z];
      } else {
        // Hanging fairy bell blossoms
        const bellId = i % 5;
        const bellT = 0.3 + (bellId / 5) * 0.6;
        const bx = Math.cos(bellT * Math.PI * 0.9) * 140 - 50;
        const by = Math.sin(bellT * Math.PI * 0.9) * 130 - 30 - 18;
        const theta = Math.random() * Math.PI * 2;
        const br = Math.random() * 22;
        return [bx + Math.cos(theta) * br, by - Math.random() * 28, Math.sin(theta) * br];
      }
    });

    // 5. Princess Star Tiara / Crown (Vương Miện Ánh Sáng Công Chúa)
    addShape((i, f) => {
      const theta = (f - 0.5) * Math.PI * 1.35;
      const baseR = 155;
      const x = Math.sin(theta) * baseR;
      const z = Math.cos(theta) * baseR * 0.45;
      // 5 Peaks of Princess Crown
      const peak = Math.pow(Math.abs(Math.cos(theta * 2.5)), 2) * 65;
      const y = peak + (Math.random() - 0.5) * 14 - 30;
      return [x, y, z];
    });

    // 6. Twin Swans forming Heart Kiss (Đôi Thiên Nga Khắc Hình Trái Tim)
    addShape((i, f) => {
      const side = (i % 2 === 0) ? 1 : -1;
      const t = (i / PARTICLE_COUNT) * Math.PI;
      // Graceful neck curve forming heart contour
      const x = side * (Math.sin(t) * 65 + Math.pow(Math.sin(t), 2) * 55);
      const y = Math.cos(t) * 95 - 10;
      const z = (Math.random() - 0.5) * 35;
      return [x, y, z];
    });

    // 7. Silk Infinity Ribbon (Dải Ruy Băng Vô Cực Của Tình Yêu)
    addShape((i, f) => {
      const t = f * Math.PI * 2;
      const scale = 175;
      const denom = 1 + Math.sin(t) * Math.sin(t);
      const x = (scale * Math.cos(t)) / denom;
      const y = (scale * Math.sin(t) * Math.cos(t)) / denom;
      const z = Math.sin(t * 2) * 45 + (Math.random() - 0.5) * 12;
      return [x, y, z];
    });

    // 8. Celestial Floral Wreath (Vòng Nguyệt Quế Tinh Vân)
    addShape((i, f) => {
      const theta = f * Math.PI * 2;
      const r = 135 + Math.sin(theta * 10) * 18 + (Math.random() - 0.5) * 15;
      const x = Math.cos(theta) * r;
      const y = Math.sin(theta) * r;
      const z = Math.cos(theta * 6) * 28 + (Math.random() - 0.5) * 10;
      return [x, y, z];
    });

    // 9. Moonlit Sakura Lotus (Đóa Sen Ánh Trăng 8 Cánh)
    addShape((i, f) => {
      const theta = f * Math.PI * 2;
      const petalR = (Math.pow(Math.abs(Math.sin(theta * 4)), 0.6) * 165 + 20) * Math.sqrt(Math.random());
      const z = -Math.cos((petalR / 185) * (Math.PI / 2)) * 52 + (Math.random() - 0.5) * 12;
      return [petalR * Math.cos(theta), petalR * Math.sin(theta), z];
    });

    // 10. Fairy Stardust Vortex (Vòng Xoáy Bụi Tiên Ước Nguyện)
    addShape((i, f) => {
      const theta = Math.sqrt(f) * Math.PI * 14;
      const r = f * 195 + 10;
      const x = Math.cos(theta) * r;
      const y = Math.sin(theta) * r;
      const z = (f - 0.5) * 150 + Math.sin(r * 0.05) * 20;
      return [x, y, z];
    });

    /* =====================================================================
       HARMONIOUS HIGH-AESTHETIC PALETTES
       ===================================================================== */
    const LUXURY_PALETTES = [
      // Rose Quartz & Pearl
      { primary: [1.0, 0.74, 0.80], secondary: [1.0, 0.92, 0.95], accent: [0.93, 0.82, 1.0] },
      // French Peony & Soft Champagne
      { primary: [1.0, 0.65, 0.74], secondary: [1.0, 0.88, 0.82], accent: [1.0, 0.96, 0.92] },
      // Fairy Mauve & Lavender Mist
      { primary: [0.92, 0.76, 1.0], secondary: [0.82, 0.92, 1.0], accent: [1.0, 0.82, 0.90] },
      // Starlight Gold & Pink Diamond
      { primary: [1.0, 0.78, 0.85], secondary: [1.0, 0.92, 0.78], accent: [0.88, 0.96, 0.98] }
    ];

    /* =====================================================================
       2D CANVAS: DELICATE FAIRY DUST (TINY GLOWING SPARKS ONLY)
       ===================================================================== */
    const overlayCanvas = document.getElementById('overlay-canvas');
    const ctx2D = overlayCanvas.getContext('2d');

    function resizeCanvas() {
      overlayCanvas.width = window.innerWidth;
      overlayCanvas.height = window.innerHeight;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const fairySparks = [];
    function spawnFairySpark(x, y) {
      fairySparks.push({
        x: x + (Math.random() - 0.5) * 14,
        y: y + (Math.random() - 0.5) * 14,
        vx: (Math.random() - 0.5) * 0.8,
        vy: -Math.random() * 1.1 - 0.3,
        size: Math.random() * 2.5 + 1.2,
        alpha: 0.9,
        char: Math.random() > 0.65 ? '✧' : null
      });
      if (fairySparks.length > 50) fairySparks.shift();
    }

    function renderFairySparks() {
      ctx2D.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

      for (let i = fairySparks.length - 1; i >= 0; i--) {
        const s = fairySparks[i];
        s.x += s.vx;
        s.y += s.vy;
        s.alpha -= 0.015;

        if (s.alpha <= 0) {
          fairySparks.splice(i, 1);
          continue;
        }

        ctx2D.save();
        ctx2D.globalAlpha = s.alpha;
        if (s.char) {
          ctx2D.fillStyle = '#ffccd5';
          ctx2D.font = '12px serif';
          ctx2D.fillText(s.char, s.x, s.y);
        } else {
          ctx2D.beginPath();
          ctx2D.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx2D.fillStyle = '#fff0f5';
          ctx2D.shadowColor = '#ffb3c6';
          ctx2D.shadowBlur = 8;
          ctx2D.fill();
        }
        ctx2D.restore();
      }
    }

    /* =====================================================================
       ANIMATION LOOP: 10 CONTINUOUS SLOW-MORPHING SHAPES
       ===================================================================== */
    const TRANSITION_DURATION = 5.8; // 5.8 seconds per continuous, smooth transformation
    const startTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);

      // Smooth Cursor Movement
      mouse.screenX += (mouse.targetScreenX - mouse.screenX) * 0.085;
      mouse.screenY += (mouse.targetScreenY - mouse.screenY) * 0.085;
      mouse.x += (mouse.targetX - mouse.x) * 0.055;
      mouse.y += (mouse.targetY - mouse.y) * 0.055;

      cursorFollower.style.transform = `translate3d(${mouse.screenX}px, ${mouse.screenY}px, 0)`;
      cursorDot.style.transform = `translate3d(${mouse.targetScreenX}px, ${mouse.targetScreenY}px, 0)`;

      // Continuous Morph Calculation across 10 shapes
      const elapsed = (now - startTime) * 0.001;
      const cyclePos = (elapsed / TRANSITION_DURATION) % shapes.length;
      const idxA = Math.floor(cyclePos);
      const idxB = (idxA + 1) % shapes.length;
      let blend = cyclePos - idxA;
      // Hermite Smoothstep for seamless, slow, fluid morphing
      blend = blend * blend * (3 - 2 * blend);

      const shapeA = shapes[idxA];
      const shapeB = shapes[idxB];

      // Palette interpolation
      const palIdxA = Math.floor(cyclePos * 0.5) % LUXURY_PALETTES.length;
      const pal = LUXURY_PALETTES[palIdxA];

      const pos = geometry.attributes.position.array;
      const col = geometry.attributes.color.array;

      const mouseWorldX = mouse.x * 140;
      const mouseWorldY = mouse.y * 105;

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;

        // Smooth shape morphing
        let tx = shapeA[i3] * (1 - blend) + shapeB[i3] * blend;
        let ty = shapeA[i3 + 1] * (1 - blend) + shapeB[i3 + 1] * blend;
        let tz = shapeA[i3 + 2] * (1 - blend) + shapeB[i3 + 2] * blend;

        // Soft mouse attraction
        const dx = mouseWorldX - pos[i3];
        const dy = mouseWorldY - pos[i3 + 1];
        const distSq = dx * dx + dy * dy;

        if (distSq < 13000) {
          const force = (1 - distSq / 13000) * 18;
          tx += (dx / 115) * force;
          ty += (dy / 115) * force;
        }

        // Viscous, elegant slow glide
        pos[i3] += (tx - pos[i3]) * 0.065;
        pos[i3 + 1] += (ty - pos[i3 + 1]) * 0.065;
        pos[i3 + 2] += (tz - pos[i3 + 2]) * 0.065;

        // Soft color breathing
        const f = i % 3;
        const c = (f === 0) ? pal.primary : (f === 1 ? pal.secondary : pal.accent);
        col[i3] += (c[0] - col[i3]) * 0.025;
        col[i3 + 1] += (c[1] - col[i3 + 1]) * 0.025;
        col[i3 + 2] += (c[2] - col[i3 + 2]) * 0.025;
      }

      geometry.attributes.position.needsUpdate = true;
      geometry.attributes.color.needsUpdate = true;

      // Gentle 3D Parallax Tilt
      const breathing = 1.0 + Math.sin(now * 0.0015) * 0.045;
      particleSystem.rotation.y += 0.002;
      particleSystem.rotation.y += (mouse.x * 0.28 - particleSystem.rotation.y) * 0.035;
      particleSystem.rotation.x += (-mouse.y * 0.20 - particleSystem.rotation.x) * 0.035;
      particleSystem.scale.set(breathing, breathing, breathing);

      renderer.render(scene, camera);
      renderFairySparks();
    }

    animate(performance.now());

    /* =====================================================================
       INTERACTION
       ===================================================================== */
    const startScreen = document.getElementById('start-screen');

    function startExperience() {
      audio.init();
      startScreen.classList.add('hidden');
    }

    startScreen.addEventListener('click', startExperience);
    startScreen.addEventListener('touchstart', startExperience);

    window.addEventListener('pointerdown', (e) => {
      if (!startScreen.classList.contains('hidden')) return;
      for (let i = 0; i < 8; i++) {
        spawnFairySpark(e.clientX, e.clientY);
      }
    });
