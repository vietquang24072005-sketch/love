<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PASTEL NEON LOVE ✨ Dịu Dàng & Mê Hoặc</title>
  
  <meta property="og:title" content="Bản Giao Hưởng Ánh Sáng Dành Riêng Cho Bạn 🌸💖">
  <meta property="og:description" content="Chạm và di chuyển chuột để cảm nhận dòng chảy ánh sáng tình yêu mềm mại, lung linh.">
  <meta property="og:image" content="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=1200&q=80">
  <meta property="og:type" content="website">

  <style>
    :root {
      --pastel-pink: #ffaec0;
      --pastel-soft-rose: #ff85a2;
      --pastel-lavender: #d8b4fe;
      --pastel-mint: #a5f3fc;
      --pastel-cream: #fff0f5;
      --bg-dark: #070209;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      cursor: none; /* Custom glowing cursor */
    }

    /* Ambient Nebular Glow */
    .ambient-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 133, 162, 0.12) 0%, rgba(216, 180, 254, 0.06) 40%, rgba(7, 2, 9, 0.98) 80%);
      z-index: 0;
      pointer-events: none;
      transition: background 2s ease;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #overlay-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Custom Floating Glowing Cursor */
    #cursor-follower {
      position: fixed;
      top: 0;
      left: 0;
      width: 32px;
      height: 32px;
      margin-left: -16px;
      margin-top: -16px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 174, 192, 0.85);
      background: radial-gradient(circle, rgba(255, 174, 192, 0.25) 0%, rgba(216, 180, 254, 0.05) 70%, transparent 100%);
      box-shadow: 0 0 20px rgba(255, 174, 192, 0.6), 0 0 35px rgba(216, 180, 254, 0.35);
      pointer-events: none;
      z-index: 99;
      transform: translate3d(-100px, -100px, 0);
      transition: width 0.3s ease, height 0.3s ease, background 0.3s ease;
    }

    #cursor-dot {
      position: fixed;
      top: 0;
      left: 0;
      width: 6px;
      height: 6px;
      margin-left: -3px;
      margin-top: -3px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 12px #ffaec0, 0 0 20px #ff85a2;
      pointer-events: none;
      z-index: 100;
      transform: translate3d(-100px, -100px, 0);
    }

    /* Intro Start Screen */
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, rgba(24, 7, 30, 0.88) 0%, rgba(7, 2, 9, 0.98) 75%);
      backdrop-filter: blur(24px);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), visibility 1.2s;
      cursor: pointer;
    }
    #start-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .heart-glow-box {
      position: relative;
      width: 130px;
      height: 130px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 32px;
    }

    .gentle-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 174, 192, 0.5);
      box-shadow: 0 0 25px rgba(255, 174, 192, 0.35);
      animation: gentleRipple 3.5s infinite ease-out;
    }
    .gentle-ring:nth-child(2) {
      animation-delay: 1.2s;
      border-color: rgba(216, 180, 254, 0.45);
    }
    .gentle-ring:nth-child(3) {
      animation-delay: 2.4s;
      border-color: rgba(165, 243, 252, 0.4);
    }

    @keyframes gentleRipple {
      0% {
        transform: scale(0.7);
        opacity: 0.85;
      }
      100% {
        transform: scale(2.6);
        opacity: 0;
      }
    }

    .pulse-btn {
      font-size: 60px;
      animation: smoothBreathe 3s infinite ease-in-out;
      filter: drop-shadow(0 0 35px rgba(255, 174, 192, 0.9));
    }

    @keyframes smoothBreathe {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 25px rgba(255, 174, 192, 0.7)); }
      50% { transform: scale(1.18); filter: drop-shadow(0 0 45px rgba(255, 133, 162, 1)); }
    }

    .start-prompt {
      color: #fff;
      font-size: 1.25rem;
      font-weight: 500;
      letter-spacing: 6px;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(255, 174, 192, 0.8), 0 0 35px rgba(216, 180, 254, 0.6);
      padding: 0 20px;
    }
    .start-subprompt {
      color: rgba(255, 240, 245, 0.65);
      font-size: 0.85rem;
      letter-spacing: 2.5px;
      margin-top: 14px;
      font-weight: 300;
    }

    /* Minimalist Glass HUD */
    #hud {
      position: absolute;
      top: 24px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 32px;
      z-index: 5;
      pointer-events: none;
    }

    .phase-badge {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--pastel-pink);
      letter-spacing: 3px;
      background: rgba(255, 174, 192, 0.06);
      border: 1px solid rgba(255, 174, 192, 0.25);
      padding: 8px 20px;
      border-radius: 40px;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 20px rgba(255, 174, 192, 0.1);
      transition: all 1s ease;
    }

    .guide-hint {
      font-size: 0.78rem;
      color: rgba(255, 240, 245, 0.6);
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(216, 180, 254, 0.5);
      animation: floatHint 3s infinite ease-in-out;
    }

    @keyframes floatHint {
      0%, 100% { opacity: 0.5; transform: translateY(0); }
      50% { opacity: 0.95; transform: translateY(-3px); }
    }

    /* Soft typography shimmer */
    .word-burst {
      position: absolute;
      pointer-events: none;
      font-weight: 600;
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      letter-spacing: 8px;
      text-transform: uppercase;
      text-shadow: 0 0 30px currentColor, 0 0 60px currentColor;
      transform: translate(-50%, -50%);
      z-index: 4;
      white-space: nowrap;
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.7));
    }
  </style>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <div class="ambient-glow" id="ambient-glow"></div>

  <!-- Custom Cursor Elements -->
  <div id="cursor-follower"></div>
  <div id="cursor-dot"></div>

  <!-- Canvases -->
  <canvas id="webgl-canvas"></canvas>
  <canvas id="overlay-canvas"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="phase-badge" id="phase-badge">ÁNH NHÌN DỊU ÊM</div>
    <div class="guide-hint">✨ Di chuyển chuột để dẫn lối ánh sáng</div>
  </div>

  <!-- Start Screen -->
  <div id="start-screen">
    <div class="heart-glow-box">
      <div class="gentle-ring"></div>
      <div class="gentle-ring"></div>
      <div class="gentle-ring"></div>
      <div class="pulse-btn">🌸</div>
    </div>
    <div class="start-prompt">CHẠM ĐỂ BẮT ĐẦU</div>
    <div class="start-subprompt">Khám phá dòng chảy ánh sáng tình yêu mềm mại</div>
  </div>

  <script>
    /* =====================================================================
       SMOOTH MOUSE & TOUCH TRACKING WITH INERTIA
       ===================================================================== */
    const mouse = {
      x: 0,
      y: 0,
      targetX: 0,
      targetY: 0,
      screenX: window.innerWidth / 2,
      screenY: window.innerHeight / 2,
      targetScreenX: window.innerWidth / 2,
      targetScreenY: window.innerHeight / 2,
      vx: 0,
      vy: 0,
      speed: 0
    };

    const cursorFollower = document.getElementById('cursor-follower');
    const cursorDot = document.getElementById('cursor-dot');

    function updateMousePosition(clientX, clientY) {
      mouse.targetScreenX = clientX;
      mouse.targetScreenY = clientY;
      mouse.targetX = (clientX / window.innerWidth) * 2 - 1;
      mouse.targetY = -(clientY / window.innerHeight) * 2 + 1;

      // Spawn smooth stardust trail on movement
      if (Math.random() > 0.3) {
        addTrailParticle(clientX, clientY);
      }
    }

    window.addEventListener('mousemove', (e) => {
      updateMousePosition(e.clientX, e.clientY);
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        updateMousePosition(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    /* =====================================================================
       ETHEREAL AMBIENT AUDIO (Soft, warm, lofi-romance chords)
       ===================================================================== */
    class AmbientAudioEngine {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.chords = [
          [261.63, 329.63, 392.00, 493.88], // Cmaj7 (Warm, peaceful)
          [220.00, 261.63, 329.63, 392.00], // Am7 (Sweet longing)
          [174.61, 220.00, 261.63, 329.63], // Fmaj7 (Romantic)
          [196.00, 246.94, 293.66, 392.00]  // G6 (Gentle resolution)
        ];
        this.currentChord = 0;
      }

      init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.isPlaying = true;
        this.scheduleNextChord();
      }

      playPadNote(freq, startTime, duration = 3.8) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, startTime);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(900, startTime);

        // Soft, smooth envelope: slow attack, long serene release
        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(0.06, startTime + 1.2);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(startTime);
        osc.stop(startTime + duration);
      }

      scheduleNextChord() {
        if (!this.isPlaying) return;
        const now = this.ctx.currentTime;
        const chord = this.chords[this.currentChord];

        chord.forEach((freq, idx) => {
          this.playPadNote(freq * 1.0, now + idx * 0.15, 4.2);
          if (idx === 3) {
            // Octave shimmer
            this.playPadNote(freq * 2.0, now + 0.8, 3.2);
          }
        });

        this.currentChord = (this.currentChord + 1) % this.chords.length;
        setTimeout(() => this.scheduleNextChord(), 3600);
      }
    }

    const audio = new AmbientAudioEngine();

    /* =====================================================================
       THREE.JS: 20,000 SILKY PARTICLES WITH FLUID MOUSE ATTRACTION
       ===================================================================== */
    const PARTICLE_COUNT = 20000;
    const canvas3D = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({
      canvas: canvas3D,
      antialias: true,
      alpha: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x070209, 0.0014);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2500);
    camera.position.z = 290;

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const baseTargetPositions = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);
    const originalColors = new Float32Array(PARTICLE_COUNT * 3);
    const targetColors = new Float32Array(PARTICLE_COUNT * 3);
    const sizes = new Float32Array(PARTICLE_COUNT);

    // Initial gentle sphere distribution
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const i3 = i * 3;
      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);
      const r = Math.cbrt(Math.random()) * 260;

      positions[i3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i3 + 2] = r * Math.cos(phi);

      baseTargetPositions[i3] = positions[i3];
      baseTargetPositions[i3 + 1] = positions[i3 + 1];
      baseTargetPositions[i3 + 2] = positions[i3 + 2];

      colors[i3] = 1.0;
      colors[i3 + 1] = 0.68;
      colors[i3 + 2] = 0.75;

      originalColors[i3] = colors[i3];
      originalColors[i3 + 1] = colors[i3 + 1];
      originalColors[i3 + 2] = colors[i3 + 2];

      targetColors[i3] = colors[i3];
      targetColors[i3 + 1] = colors[i3 + 1];
      targetColors[i3 + 2] = colors[i3 + 2];

      sizes[i] = Math.random() * 2.4 + 1.2;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    // High quality soft radial stardust texture
    function createStardustTexture() {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.2, 'rgba(255, 185, 205, 0.9)');
      grad.addColorStop(0.5, 'rgba(216, 180, 254, 0.35)');
      grad.addColorStop(0.8, 'rgba(255, 133, 162, 0.1)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    }

    const material = new THREE.PointsMaterial({
      size: 5.6,
      map: createStardustTexture(),
      vertexColors: true,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    /* =====================================================================
       MATHEMATICAL GEOMETRY: REFINED & ELEGANT SHAPES
       ===================================================================== */
    // 1. Crystal Volumetric 3D Heart (Dense core + Stardust halo)
    function generateHeartShape() {
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        const t = Math.PI * 2 * Math.random();
        const u = Math.PI * (Math.random() - 0.5);
        const r = Math.pow(Math.random(), 0.55); // Smooth organic volume

        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        const z = u * 15;

        const scale = 7.8 * r;
        baseTargetPositions[i3] = x * scale;
        baseTargetPositions[i3 + 1] = y * scale;
        baseTargetPositions[i3 + 2] = z * scale * (1.1 - Math.abs(x) / 30);
      }
    }

    // 2. Cosmic Hypnotic Eye (Tracks cursor organically)
    function generateEyeShape() {
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        const ratio = i / PARTICLE_COUNT;

        if (ratio < 0.28) {
          // Heart Pupil
          const t = Math.PI * 2 * Math.random();
          const r = Math.sqrt(Math.random()) * 26;
          baseTargetPositions[i3] = (16 * Math.pow(Math.sin(t), 3)) * (r / 20);
          baseTargetPositions[i3 + 1] = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * (r / 20);
          baseTargetPositions[i3 + 2] = (Math.random() - 0.5) * 12;
        } else if (ratio < 0.72) {
          // Delicate Iris Fibers
          const angle = Math.random() * Math.PI * 2;
          const radius = 28 + Math.random() * 62;
          baseTargetPositions[i3] = Math.cos(angle) * radius;
          baseTargetPositions[i3 + 1] = Math.sin(angle) * radius;
          baseTargetPositions[i3 + 2] = (Math.random() - 0.5) * 20;
        } else {
          // Soft Eyelids and Aura
          const width = 195;
          const height = 82;
          const x = (Math.random() - 0.5) * width * 2;
          const sign = Math.random() > 0.5 ? 1 : -1;
          const y = sign * height * Math.cos((x / (width * 2)) * Math.PI) + (Math.random() - 0.5) * 18;
          baseTargetPositions[i3] = x;
          baseTargetPositions[i3 + 1] = y;
          baseTargetPositions[i3 + 2] = (Math.random() - 0.5) * 45;
        }
      }
    }

    // 3. Gentle Celestial River (Smooth ribbon of romantic stars)
    function generateRiverShape() {
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        const t = (i / PARTICLE_COUNT - 0.5) * 1200;
        const wave = Math.sin(t * 0.008) * 90;
        const spread = (Math.random() - 0.5) * 110;

        baseTargetPositions[i3] = t * 0.85;
        baseTargetPositions[i3 + 1] = wave + spread;
        baseTargetPositions[i3 + 2] = Math.cos(t * 0.007) * 90 + (Math.random() - 0.5) * 90;
      }
    }

    // 4. Sacred Rose Blossom (8-fold floral mandala)
    function generateMandalaShape() {
      const petals = 8;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        const armIndex = i % petals;
        const baseAngle = (armIndex / petals) * Math.PI * 2;
        const dist = Math.random() * 165;
        const spiralAngle = baseAngle + Math.sin(dist * 0.035) * 0.45;

        baseTargetPositions[i3] = Math.cos(spiralAngle) * dist;
        baseTargetPositions[i3 + 1] = Math.sin(spiralAngle) * dist;
        baseTargetPositions[i3 + 2] = Math.cos(dist * 0.06) * 38;
      }
    }

    /* =====================================================================
       HARMONIOUS PASTEL PALETTES
       ===================================================================== */
    const PASTEL_PALETTES = [
      { primary: [1.0, 0.68, 0.75], secondary: [0.85, 0.71, 1.0], accent: [1.0, 0.94, 0.96] },
      { primary: [1.0, 0.55, 0.68], secondary: [0.65, 0.95, 0.99], accent: [0.98, 0.82, 0.92] },
      { primary: [0.92, 0.72, 1.0], secondary: [1.0, 0.82, 0.75], accent: [1.0, 0.95, 0.80] }
    ];

    let currentPaletteIndex = 0;
    function setTargetPalette(index) {
      const pal = PASTEL_PALETTES[index % PASTEL_PALETTES.length];
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        const f = i % 3;
        let c = pal.primary;
        if (f === 1) c = pal.secondary;
        if (f === 2) c = pal.accent;

        targetColors[i3] = c[0] + (Math.random() - 0.5) * 0.06;
        targetColors[i3 + 1] = c[1] + (Math.random() - 0.5) * 0.06;
        targetColors[i3 + 2] = c[2] + (Math.random() - 0.5) * 0.06;
      }
    }

    /* =====================================================================
       SLOW, SMOOTH, HYPNOTIC PHASES (6.5s per phase, fluid transition)
       ===================================================================== */
    const PHASES = [
      { name: "ÁNH NHÌN DỊU ÊM", fn: generateEyeShape, camZ: 220, word: "ÁNH MẮT DỊU ÊM 🌸" },
      { name: "TRÁI TIM NỞ HOA", fn: generateHeartShape, camZ: 255, word: "NHỊP ĐẬP YÊU THƯƠNG 💕" },
      { name: "DÒNG SÔNG VÌ SAO", fn: generateRiverShape, camZ: 240, word: "BẾN ĐỖ BÌNH YÊN ✨" },
      { name: "HOA HỒNG VĨNH CỬU", fn: generateMandalaShape, camZ: 285, word: "VẸN NGUYÊN TÌNH YÊU 💖" }
    ];

    let currentPhaseIndex = 0;
    const phaseBadge = document.getElementById('phase-badge');

    function createGentleWord(text, color) {
      const el = document.createElement('div');
      el.className = 'word-burst';
      el.innerText = text;
      el.style.color = color;
      el.style.left = (window.innerWidth / 2) + 'px';
      el.style.top = (window.innerHeight * 0.42) + 'px';
      document.body.appendChild(el);

      gsap.fromTo(el,
        { scale: 0.85, opacity: 0, y: 15 },
        {
          scale: 1.05,
          opacity: 0.9,
          y: -15,
          duration: 3.5,
          ease: "power2.out",
          onComplete: () => {
            gsap.to(el, { opacity: 0, duration: 1.2, onComplete: () => el.remove() });
          }
        }
      );
    }

    function transitionToNextPhase() {
      currentPhaseIndex = (currentPhaseIndex + 1) % PHASES.length;
      currentPaletteIndex = (currentPaletteIndex + 1) % PASTEL_PALETTES.length;
      const phase = PHASES[currentPhaseIndex];

      phase.fn();
      setTargetPalette(currentPaletteIndex);

      phaseBadge.innerText = phase.name;
      const pal = PASTEL_PALETTES[currentPaletteIndex];
      const rgb = `rgb(${Math.round(pal.primary[0]*255)}, ${Math.round(pal.primary[1]*255)}, ${Math.round(pal.primary[2]*255)})`;
      phaseBadge.style.color = rgb;
      phaseBadge.style.borderColor = `rgba(${Math.round(pal.primary[0]*255)}, ${Math.round(pal.primary[1]*255)}, ${Math.round(pal.primary[2]*255)}, 0.4)`;
      createGentleWord(phase.word, rgb);

      // Smooth camera glide
      gsap.to(camera.position, {
        z: phase.camZ,
        duration: 3.2,
        ease: "power2.out"
      });
    }

    /* =====================================================================
       2D OVERLAY: EYE GAZE TRACKING + STARDUST MOUSE TRAIL
       ===================================================================== */
    const overlayCanvas = document.getElementById('overlay-canvas');
    const ctx2D = overlayCanvas.getContext('2d');

    function resizeCanvas() {
      overlayCanvas.width = window.innerWidth;
      overlayCanvas.height = window.innerHeight;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Floating Stardust Particles emitted by Mouse
    const trailParticles = [];
    function addTrailParticle(x, y) {
      trailParticles.push({
        x: x + (Math.random() - 0.5) * 14,
        y: y + (Math.random() - 0.5) * 14,
        vx: (Math.random() - 0.5) * 1.5,
        vy: -Math.random() * 1.8 - 0.5,
        size: Math.random() * 4.5 + 2.5,
        alpha: 0.95,
        color: Math.random() > 0.4 ? '#ffaec0' : '#d8b4fe',
        char: Math.random() > 0.65 ? (Math.random() > 0.5 ? '🌸' : '✨') : null,
        rotation: Math.random() * Math.PI * 2
      });
      if (trailParticles.length > 90) trailParticles.shift();
    }

    let eyeBlinkProgress = 0;
    let eyeBlinkTimer = 0;

    function drawGazingEye(cx, cy, targetX, targetY, scale) {
      ctx2D.save();
      ctx2D.translate(cx, cy);
      ctx2D.scale(scale, scale * (1 - eyeBlinkProgress * 0.94));

      // Calculate smooth gaze angle towards cursor
      const dx = targetX - cx;
      const dy = targetY - cy;
      const angle = Math.atan2(dy, dx);
      const dist = Math.min(Math.hypot(dx, dy) * 0.038, 20); // Gaze displacement
      const pupilX = Math.cos(angle) * dist;
      const pupilY = Math.sin(angle) * dist;

      const pal = PASTEL_PALETTES[currentPaletteIndex];
      const glowPink = `rgba(${Math.round(pal.primary[0]*255)}, ${Math.round(pal.primary[1]*255)}, ${Math.round(pal.primary[2]*255)}, 0.85)`;
      const glowLilac = `rgba(${Math.round(pal.secondary[0]*255)}, ${Math.round(pal.secondary[1]*255)}, ${Math.round(pal.secondary[2]*255)}, 0.7)`;

      // Soft Almond Contour
      ctx2D.beginPath();
      ctx2D.moveTo(-105, 0);
      ctx2D.quadraticCurveTo(0, -65, 105, 0);
      ctx2D.quadraticCurveTo(0, 65, -105, 0);
      ctx2D.closePath();

      ctx2D.strokeStyle = glowPink;
      ctx2D.lineWidth = 3;
      ctx2D.shadowColor = glowPink;
      ctx2D.shadowBlur = 24;
      ctx2D.stroke();

      // Iris looking towards cursor
      ctx2D.beginPath();
      ctx2D.arc(pupilX, pupilY, 36, 0, Math.PI * 2);
      ctx2D.fillStyle = glowLilac;
      ctx2D.shadowColor = glowLilac;
      ctx2D.shadowBlur = 18;
      ctx2D.fill();
      ctx2D.stroke();

      // Heart Pupil looking towards cursor
      ctx2D.save();
      ctx2D.translate(pupilX, pupilY - 4);
      ctx2D.beginPath();
      const hScale = 1.15;
      ctx2D.moveTo(0, 8 * hScale);
      ctx2D.bezierCurveTo(-14 * hScale, -8 * hScale, -28 * hScale, 14 * hScale, 0, 32 * hScale);
      ctx2D.bezierCurveTo(28 * hScale, 14 * hScale, 14 * hScale, -8 * hScale, 0, 8 * hScale);
      ctx2D.fillStyle = '#fff5f8';
      ctx2D.shadowColor = '#fff';
      ctx2D.shadowBlur = 20;
      ctx2D.fill();
      ctx2D.restore();

      ctx2D.restore();
    }

    function render2D(now) {
      ctx2D.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

      // 1. Natural slow blink
      eyeBlinkTimer += 0.018;
      if (Math.sin(eyeBlinkTimer * 2) > 0.98) {
        eyeBlinkProgress = Math.min(1, eyeBlinkProgress + 0.18);
      } else {
        eyeBlinkProgress = Math.max(0, eyeBlinkProgress - 0.14);
      }

      // 2. Render Gazing Eyes (in Phase 0 or 3)
      if (currentPhaseIndex === 0 || currentPhaseIndex === 3) {
        const midX = overlayCanvas.width / 2;
        const midY = overlayCanvas.height / 2;
        const spacing = Math.min(overlayCanvas.width * 0.22, 160);
        const scale = Math.min(overlayCanvas.width / 820, 1.1);

        drawGazingEye(midX - spacing, midY, mouse.screenX, mouse.screenY, scale);
        drawGazingEye(midX + spacing, midY, mouse.screenX, mouse.screenY, scale);

        // Gentle light thread between eyes
        ctx2D.beginPath();
        ctx2D.moveTo(midX - spacing, midY);
        ctx2D.lineTo(midX + spacing, midY);
        ctx2D.strokeStyle = 'rgba(255, 240, 248, 0.35)';
        ctx2D.lineWidth = 1.5;
        ctx2D.shadowBlur = 12;
        ctx2D.shadowColor = '#ffaec0';
        ctx2D.stroke();
      }

      // 3. Render Floating Mouse Trail Particles
      for (let i = trailParticles.length - 1; i >= 0; i--) {
        const p = trailParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.015;
        p.size *= 0.98;

        if (p.alpha <= 0) {
          trailParticles.splice(i, 1);
          continue;
        }

        ctx2D.save();
        ctx2D.globalAlpha = p.alpha;
        if (p.char) {
          ctx2D.font = `${p.size * 3.8}px serif`;
          ctx2D.fillText(p.char, p.x, p.y);
        } else {
          ctx2D.beginPath();
          ctx2D.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx2D.fillStyle = p.color;
          ctx2D.shadowColor = p.color;
          ctx2D.shadowBlur = 12;
          ctx2D.fill();
        }
        ctx2D.restore();
      }
    }

    /* =====================================================================
       MAIN ANIMATION LOOP: SILKY FLUID MORPHING + MOUSE ATTRACTION
       ===================================================================== */
    let lastTime = 0;
    let phaseTimer = 0;
    const PHASE_DURATION = 6.8; // Gentle, relaxing 6.8 seconds per phase

    // Slow organic breathing rate (~65 BPM)
    let breathingScale = 1.0;

    function animate(now) {
      requestAnimationFrame(animate);
      const delta = (now - lastTime) * 0.001 || 0.016;
      lastTime = now;

      // Mouse Smooth Interpolation (Inertia)
      mouse.screenX += (mouse.targetScreenX - mouse.screenX) * 0.085;
      mouse.screenY += (mouse.targetScreenY - mouse.screenY) * 0.085;
      mouse.x += (mouse.targetX - mouse.x) * 0.06;
      mouse.y += (mouse.targetY - mouse.y) * 0.06;

      // Move Custom Cursor with buttery smoothness
      cursorFollower.style.transform = `translate3d(${mouse.screenX}px, ${mouse.screenY}px, 0)`;
      cursorDot.style.transform = `translate3d(${mouse.targetScreenX}px, ${mouse.targetScreenY}px, 0)`;

      // Phase timing
      phaseTimer += delta;
      if (phaseTimer >= PHASE_DURATION) {
        phaseTimer = 0;
        transitionToNextPhase();
      }

      // Gentle breathing wave
      breathingScale = 1.0 + Math.sin(now * 0.0022) * 0.065;

      // Smooth Morphing Particles + Interactive Mouse Attraction
      const posAttr = geometry.attributes.position;
      const colAttr = geometry.attributes.color;
      const pos = posAttr.array;
      const col = colAttr.array;

      // Project mouse into 3D world space coordinates
      const mouseWorldX = mouse.x * 160;
      const mouseWorldY = mouse.y * 120;

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;

        // Base target position
        let tx = baseTargetPositions[i3];
        let ty = baseTargetPositions[i3 + 1];
        let tz = baseTargetPositions[i3 + 2];

        // MOUSE INFLUENCE: Fluid magnetic attraction & soft eddy swirl
        const dx = mouseWorldX - pos[i3];
        const dy = mouseWorldY - pos[i3 + 1];
        const distSq = dx * dx + dy * dy;

        if (distSq < 18000) {
          const dist = Math.sqrt(distSq);
          const force = (1.0 - dist / 134) * 28;
          tx += (dx / dist) * force + Math.sin(now * 0.003 + i) * 8;
          ty += (dy / dist) * force + Math.cos(now * 0.003 + i) * 8;
          tz += force * 0.4;
        }

        // Silky, viscous interpolation (Slow & Super Smooth)
        pos[i3] += (tx - pos[i3]) * 0.024;
        pos[i3 + 1] += (ty - pos[i3 + 1]) * 0.024;
        pos[i3 + 2] += (tz - pos[i3 + 2]) * 0.024;

        // Color transition
        col[i3] += (targetColors[i3] - col[i3]) * 0.02;
        col[i3 + 1] += (targetColors[i3 + 1] - col[i3 + 1]) * 0.02;
        col[i3 + 2] += (targetColors[i3 + 2] - col[i3 + 2]) * 0.02;
      }
      posAttr.needsUpdate = true;
      colAttr.needsUpdate = true;

      // 3D Parallax: Scene gently tilts & tracks cursor orientation
      particleSystem.rotation.y += 0.003;
      particleSystem.rotation.y += (mouse.x * 0.35 - particleSystem.rotation.y) * 0.04;
      particleSystem.rotation.x += (-mouse.y * 0.25 - particleSystem.rotation.x) * 0.04;

      particleSystem.scale.set(breathingScale, breathingScale, breathingScale);

      renderer.render(scene, camera);
      render2D(now * 0.001);
    }

    generateEyeShape();
    setTargetPalette(0);
    animate(0);

    /* =====================================================================
       START INTERACTION
       ===================================================================== */
    const startScreen = document.getElementById('start-screen');

    function startExperience() {
      audio.init();
      startScreen.classList.add('hidden');
      transitionToNextPhase();
    }

    startScreen.addEventListener('click', startExperience);
    startScreen.addEventListener('touchstart', startExperience);

    window.addEventListener('pointerdown', (e) => {
      if (!startScreen.classList.contains('hidden')) return;

      // Ripple extra stardust on click
      for (let i = 0; i < 14; i++) {
        addTrailParticle(e.clientX, e.clientY);
      }
      gsap.to(cursorFollower, { scale: 1.8, duration: 0.2, yoyo: true, repeat: 1 });
    });
  </script>
</body>
</html>
