<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VƯỜN HOA & TRÁI TIM PASTEL ✨ Siêu Mượt</title>
  
  <meta property="og:title" content="Vườn Hoa & Trái Tim Dành Riêng Cho Bạn 🌸💖">
  <meta property="og:description" content="Chuyển động hoa và trái tim biến hình liên tục, êm dịu, tương tác theo con trỏ chuột.">
  <meta property="og:image" content="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=1200&q=80">
  <meta property="og:type" content="website">

  <style>
    :root {
      --pastel-cherry: #ffb7c5;
      --pastel-rose: #ff85a1;
      --pastel-blush: #fbcfe8;
      --pastel-lilac: #e9d5ff;
      --bg-dark: #08020a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      cursor: none;
    }

    /* Ambient Glow */
    .ambient-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 133, 161, 0.14) 0%, rgba(233, 213, 255, 0.06) 45%, rgba(8, 2, 10, 0.98) 85%);
      z-index: 0;
      pointer-events: none;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #overlay-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Floating Flower Cursor */
    #cursor-follower {
      position: fixed;
      top: 0;
      left: 0;
      width: 36px;
      height: 36px;
      margin-left: -18px;
      margin-top: -18px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 183, 197, 0.85);
      background: radial-gradient(circle, rgba(255, 183, 197, 0.35) 0%, rgba(233, 213, 255, 0.05) 70%, transparent 100%);
      box-shadow: 0 0 20px rgba(255, 133, 161, 0.6), 0 0 40px rgba(233, 213, 255, 0.3);
      pointer-events: none;
      z-index: 99;
      transform: translate3d(-100px, -100px, 0);
    }

    #cursor-icon {
      position: fixed;
      top: 0;
      left: 0;
      font-size: 14px;
      margin-left: -7px;
      margin-top: -8px;
      pointer-events: none;
      z-index: 100;
      transform: translate3d(-100px, -100px, 0);
      filter: drop-shadow(0 0 8px #ff85a1);
    }

    /* Start Screen */
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, rgba(28, 8, 32, 0.9) 0%, rgba(8, 2, 10, 0.98) 78%);
      backdrop-filter: blur(20px);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), visibility 1.2s;
      cursor: pointer;
    }
    #start-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .flower-box {
      position: relative;
      width: 130px;
      height: 130px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 28px;
    }

    .petal-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 183, 197, 0.6);
      box-shadow: 0 0 25px rgba(255, 183, 197, 0.35);
      animation: floralRipple 3.5s infinite ease-out;
    }
    .petal-ring:nth-child(2) {
      animation-delay: 1.2s;
      border-color: rgba(244, 114, 182, 0.45);
    }
    .petal-ring:nth-child(3) {
      animation-delay: 2.4s;
      border-color: rgba(233, 213, 255, 0.4);
    }

    @keyframes floralRipple {
      0% { transform: scale(0.65); opacity: 0.9; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    .bloom-center-icon {
      font-size: 60px;
      animation: gentleBloom 3.2s infinite ease-in-out;
      filter: drop-shadow(0 0 30px rgba(255, 133, 161, 0.95));
    }

    @keyframes gentleBloom {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.15) rotate(10deg); }
    }

    .start-prompt {
      color: #fff;
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: 6px;
      text-transform: uppercase;
      text-shadow: 0 0 16px rgba(255, 183, 197, 0.9), 0 0 35px rgba(233, 213, 255, 0.7);
      padding: 0 20px;
      text-align: center;
    }
    .start-subprompt {
      color: rgba(255, 240, 246, 0.7);
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-top: 14px;
      text-align: center;
      font-weight: 300;
    }

    /* Minimalist HUD */
    #hud {
      position: absolute;
      top: 24px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 28px;
      z-index: 5;
      pointer-events: none;
    }

    .phase-badge {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--pastel-cherry);
      letter-spacing: 2.5px;
      background: rgba(255, 183, 197, 0.08);
      border: 1px solid rgba(255, 183, 197, 0.28);
      padding: 8px 20px;
      border-radius: 40px;
      backdrop-filter: blur(14px);
      box-shadow: 0 4px 20px rgba(255, 183, 197, 0.1);
      transition: all 1s ease;
    }

    .hint-label {
      font-size: 0.78rem;
      color: rgba(255, 240, 246, 0.6);
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(233, 213, 255, 0.5);
    }

    /* Floating Words */
    .word-burst {
      position: absolute;
      pointer-events: none;
      font-weight: 600;
      font-size: clamp(1.6rem, 4.5vw, 3rem);
      letter-spacing: 8px;
      text-transform: uppercase;
      text-shadow: 0 0 25px currentColor, 0 0 50px currentColor;
      transform: translate(-50%, -50%);
      z-index: 4;
      white-space: nowrap;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.8));
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <div class="ambient-glow"></div>

  <!-- Custom Cursor -->
  <div id="cursor-follower"></div>
  <div id="cursor-icon">🌸</div>

  <!-- Canvases -->
  <canvas id="webgl-canvas"></canvas>
  <canvas id="overlay-canvas"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="phase-badge" id="phase-badge">ĐÓA HOA HỒNG BIẾN HÌNH</div>
    <div class="hint-label">🌸 Rê chuột dẫn lối cánh hoa</div>
  </div>

  <!-- Start Screen -->
  <div id="start-screen">
    <div class="flower-box">
      <div class="petal-ring"></div>
      <div class="petal-ring"></div>
      <div class="petal-ring"></div>
      <div class="bloom-center-icon">🌸</div>
    </div>
    <div class="start-prompt">CHẠM ĐỂ BẮT ĐẦU</div>
    <div class="start-subprompt">Hoa & Trái tim biến hình liên tục, êm dịu, siêu mượt</div>
  </div>

  <script>
    /* =====================================================================
       OPTIMIZED MOUSE TRACKING
       ===================================================================== */
    const mouse = {
      x: 0,
      y: 0,
      targetX: 0,
      targetY: 0,
      screenX: window.innerWidth / 2,
      screenY: window.innerHeight / 2,
      targetScreenX: window.innerWidth / 2,
      targetScreenY: window.innerHeight / 2,
      vx: 0,
      vy: 0,
      lastScreenX: window.innerWidth / 2,
      lastScreenY: window.innerHeight / 2
    };

    const cursorFollower = document.getElementById('cursor-follower');
    const cursorIcon = document.getElementById('cursor-icon');

    function onPointerMove(clientX, clientY) {
      mouse.targetScreenX = clientX;
      mouse.targetScreenY = clientY;
      mouse.targetX = (clientX / window.innerWidth) * 2 - 1;
      mouse.targetY = -(clientY / window.innerHeight) * 2 + 1;

      // Spawn subtle blossom trail
      if (Math.random() > 0.4) {
        spawnMouseBlossom(clientX, clientY);
      }
    }

    window.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    /* =====================================================================
       AUDIO: RELAXING HARP & PAD ROMANCE
       ===================================================================== */
    class RomanticAudio {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.chords = [
          [174.61, 261.63, 329.63, 392.00], // Fmaj7
          [196.00, 246.94, 293.66, 392.00], // G6
          [164.81, 246.94, 329.63, 392.00], // Em7
          [220.00, 261.63, 329.63, 440.00]  // Am7
        ];
        this.idx = 0;
      }

      init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.isPlaying = true;
        this.loop();
      }

      playPluck(freq, time) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, time);

        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(0.045, time + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 3.2);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(time);
        osc.stop(time + 3.2);
      }

      loop() {
        if (!this.isPlaying) return;
        const now = this.ctx.currentTime;
        const chord = this.chords[this.idx];
        chord.forEach((note, i) => {
          this.playPluck(note, now + i * 0.25);
        });
        this.idx = (this.idx + 1) % this.chords.length;
        setTimeout(() => this.loop(), 3600);
      }
    }
    const audio = new RomanticAudio();

    /* =====================================================================
       THREE.JS: 7,500 PARTICLES (LOCKED 60-120 FPS ZERO LAG)
       ===================================================================== */
    const PARTICLE_COUNT = 7500;
    const canvas3D = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({
      canvas: canvas3D,
      antialias: true,
      alpha: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.z = 270;

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);

    // Initial positions
    for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 400;
      colors[i] = 1.0;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    // Particle Texture
    function createGlowTexture() {
      const c = document.createElement('canvas');
      c.width = 64;
      c.height = 64;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.25, 'rgba(255, 183, 197, 0.95)');
      grad.addColorStop(0.6, 'rgba(244, 114, 182, 0.35)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }

    const material = new THREE.PointsMaterial({
      size: 6.8,
      map: createGlowTexture(),
      vertexColors: true,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    /* =====================================================================
       PRECOMPUTED 4 SHAPES (FLOWERS & HEARTS ONLY)
       ===================================================================== */
    // Shape 0: 3D Volumetric Heart (Trái Tim Pha Lê)
    const shapeHeart = new Float32Array(PARTICLE_COUNT * 3);
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const i3 = i * 3;
      const t = Math.PI * 2 * (i / PARTICLE_COUNT);
      const r = Math.pow(Math.random(), 0.5);
      const u = (Math.random() - 0.5) * Math.PI;

      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      const z = u * 15;

      const scale = 8.2 * r;
      shapeHeart[i3] = x * scale;
      shapeHeart[i3 + 1] = y * scale;
      shapeHeart[i3 + 2] = z * scale * (1.1 - Math.abs(x) / 32);
    }

    // Shape 1: 3D Blooming Rose (Đóa Hoa Hồng Nở Rộ)
    const shapeRose = new Float32Array(PARTICLE_COUNT * 3);
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const i3 = i * 3;
      const fraction = i / PARTICLE_COUNT;
      const theta = i * 2.39996; // Golden angle spiral
      const radius = Math.sqrt(fraction) * 175;
      const petalWave = Math.sin(theta * 5) * 16;
      const z = Math.pow(fraction, 1.2) * 85 - 35 + petalWave;

      shapeRose[i3] = (radius + petalWave * 0.5) * Math.cos(theta);
      shapeRose[i3 + 1] = (radius + petalWave * 0.5) * Math.sin(theta);
      shapeRose[i3 + 2] = z;
    }

    // Shape 2: Swirling Petal Galaxy (Lốc Xoáy Cánh Hoa Vô Tận)
    const shapeVortex = new Float32Array(PARTICLE_COUNT * 3);
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const i3 = i * 3;
      const arm = i % 4;
      const dist = (i / PARTICLE_COUNT) * 210 + 15;
      const angle = (arm / 4) * Math.PI * 2 + dist * 0.032;
      const height = (Math.random() - 0.5) * 60;

      shapeVortex[i3] = Math.cos(angle) * dist;
      shapeVortex[i3 + 1] = Math.sin(angle) * dist;
      shapeVortex[i3 + 2] = height + Math.sin(dist * 0.04) * 24;
    }

    // Shape 3: Blooming Lotus / Sakura 8-Petals (Đóa Hoa Sen / Hoa Đào 8 Cánh)
    const shapeLotus = new Float32Array(PARTICLE_COUNT * 3);
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const i3 = i * 3;
      const theta = (i / PARTICLE_COUNT) * Math.PI * 2;
      const rSpread = Math.random();
      const petalR = (Math.pow(Math.abs(Math.sin(theta * 4)), 0.65) * 160 + 20) * rSpread;
      const z = -Math.cos((petalR / 180) * (Math.PI / 2)) * 55 + (Math.random() - 0.5) * 12;

      shapeLotus[i3] = petalR * Math.cos(theta);
      shapeLotus[i3 + 1] = petalR * Math.sin(theta);
      shapeLotus[i3 + 2] = z;
    }

    const SHAPES = [
      { name: "TRÁI TIM HOA BIẾN HÌNH", data: shapeHeart, word: "TRÁI TIM ĐẮM SAY 💖" },
      { name: "ĐÓA HOA HỒNG NỞ RỘ", data: shapeRose, word: "HOA HỒNG NGÁT HƯƠNG 🌸" },
      { name: "LỐC XOÁY CÁNH HOA", data: shapeVortex, word: "MƯA HOA VÔ TẬN ✨" },
      { name: "HOA ĐÀO 8 CÁNH NỞ HOA", data: shapeLotus, word: "BÌNH YÊN BÊN BẠN 💕" }
    ];

    /* =====================================================================
       CONTINUOUS MORPHING ENGINE (CHUYỂN CẢNH LIÊN TỤC KHÔNG DỪNG - MƯỢT VÀ CHẬM)
       ===================================================================== */
    const CYCLE_DURATION = 6.0; // 6 seconds per smooth transition
    let currentIdxA = 0;
    const phaseBadge = document.getElementById('phase-badge');

    function createGentleWord(text) {
      const el = document.createElement('div');
      el.className = 'word-burst';
      el.innerText = text;
      el.style.color = '#ffb7c5';
      el.style.left = (window.innerWidth / 2) + 'px';
      el.style.top = (window.innerHeight * 0.42) + 'px';
      document.body.appendChild(el);

      gsap.fromTo(el,
        { scale: 0.85, opacity: 0, y: 12 },
        {
          scale: 1.05,
          opacity: 0.9,
          y: -12,
          duration: 3.2,
          ease: "power2.out",
          onComplete: () => {
            gsap.to(el, { opacity: 0, duration: 1.0, onComplete: () => el.remove() });
          }
        }
      );
    }

    /* =====================================================================
       2D CANVAS: 35 FALLING SAKURA PETALS (PRE-RENDERED SPRITES = ZERO LAG)
       ===================================================================== */
    const overlayCanvas = document.getElementById('overlay-canvas');
    const ctx2D = overlayCanvas.getContext('2d');

    function resizeCanvas() {
      overlayCanvas.width = window.innerWidth;
      overlayCanvas.height = window.innerHeight;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Pre-rendered offscreen sprite for petal
    const spritePetal = document.createElement('canvas');
    spritePetal.width = 48;
    spritePetal.height = 48;
    const sCtx = spritePetal.getContext('2d');
    sCtx.translate(24, 24);
    sCtx.beginPath();
    sCtx.moveTo(0, -18);
    sCtx.quadraticCurveTo(12, -7, 9, 11);
    sCtx.quadraticCurveTo(0, 18, -9, 11);
    sCtx.quadraticCurveTo(-12, -7, 0, -18);
    sCtx.closePath();
    const pGrad = sCtx.createRadialGradient(0, 0, 0, 0, 0, 18);
    pGrad.addColorStop(0, '#fff5f8');
    pGrad.addColorStop(0.5, '#ffb7c5');
    pGrad.addColorStop(1, 'rgba(255, 133, 161, 0.75)');
    sCtx.fillStyle = pGrad;
    sCtx.shadowColor = '#ff85a1';
    sCtx.shadowBlur = 8;
    sCtx.fill();

    // Falling Petals array
    const PETAL_COUNT_2D = 32;
    const fallingPetals = [];

    class FastPetal {
      constructor() {
        this.reset(true);
      }

      reset(init = false) {
        this.x = Math.random() * overlayCanvas.width;
        this.y = init ? Math.random() * overlayCanvas.height : -30;
        this.scale = Math.random() * 0.5 + 0.65;
        this.speedY = Math.random() * 0.9 + 0.6;
        this.speedX = Math.random() * 0.6 - 0.3;
        this.angle = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.02;
        this.sway = Math.random() * Math.PI * 2;
        this.opacity = Math.random() * 0.35 + 0.6;
      }

      update(windX, windY) {
        this.sway += 0.015;
        this.angle += this.rotSpeed;
        this.x += this.speedX + Math.sin(this.sway) * 0.75 + windX;
        this.y += this.speedY + windY;

        if (this.y > overlayCanvas.height + 40 || this.x < -40 || this.x > overlayCanvas.width + 40) {
          this.reset(false);
        }
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.scale(this.scale, this.scale);
        ctx.globalAlpha = this.opacity;
        ctx.drawImage(spritePetal, -24, -24);
        ctx.restore();
      }
    }

    for (let i = 0; i < PETAL_COUNT_2D; i++) {
      fallingPetals.push(new FastPetal());
    }

    // Cursor blossom sparks
    const mouseBlossoms = [];
    function spawnMouseBlossom(x, y) {
      mouseBlossoms.push({
        x: x + (Math.random() - 0.5) * 12,
        y: y + (Math.random() - 0.5) * 12,
        vx: (Math.random() - 0.5) * 1.4,
        vy: -Math.random() * 1.5 - 0.4,
        size: Math.random() * 6 + 7,
        alpha: 0.95,
        type: Math.random() > 0.4 ? '🌸' : '💖'
      });
      if (mouseBlossoms.length > 40) mouseBlossoms.shift();
    }

    function render2D() {
      ctx2D.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

      mouse.vx = mouse.screenX - mouse.lastScreenX;
      mouse.vy = mouse.screenY - mouse.lastScreenY;
      mouse.lastScreenX = mouse.screenX;
      mouse.lastScreenY = mouse.screenY;

      // Draw Falling Petals with wind influence
      fallingPetals.forEach(petal => {
        const dx = petal.x - mouse.screenX;
        const dy = petal.y - mouse.screenY;
        const distSq = dx * dx + dy * dy;
        let windX = 0;
        let windY = 0;

        if (distSq < 16000) {
          const dist = Math.sqrt(distSq);
          const force = (1 - dist / 126) * 3;
          windX = (dx / dist) * force + mouse.vx * 0.25;
          windY = (dy / dist) * force + mouse.vy * 0.25;
        }

        petal.update(windX, windY);
        petal.draw(ctx2D);
      });

      // Draw Cursor Blossoms
      for (let i = mouseBlossoms.length - 1; i >= 0; i--) {
        const p = mouseBlossoms[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.018;

        if (p.alpha <= 0) {
          mouseBlossoms.splice(i, 1);
          continue;
        }

        ctx2D.save();
        ctx2D.globalAlpha = p.alpha;
        ctx2D.font = `${p.size * 2.5}px serif`;
        ctx2D.fillText(p.type, p.x - p.size, p.y + p.size);
        ctx2D.restore();
      }
    }

    /* =====================================================================
       MAIN ANIMATION LOOP: CONTINUOUS MORPHING + SMOOTH PERFORMANCE
       ===================================================================== */
    let startTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);

      // Smooth Mouse Interpolation
      mouse.screenX += (mouse.targetScreenX - mouse.screenX) * 0.09;
      mouse.screenY += (mouse.targetScreenY - mouse.screenY) * 0.09;
      mouse.x += (mouse.targetX - mouse.x) * 0.06;
      mouse.y += (mouse.targetY - mouse.y) * 0.06;

      cursorFollower.style.transform = `translate3d(${mouse.screenX}px, ${mouse.screenY}px, 0)`;
      cursorIcon.style.transform = `translate3d(${mouse.targetScreenX}px, ${mouse.targetScreenY}px, 0)`;

      // Continuous Fluid Morph Cycle Calculation
      const elapsed = (now - startTime) * 0.001;
      const cyclePos = (elapsed / CYCLE_DURATION) % SHAPES.length;
      const idxA = Math.floor(cyclePos);
      const idxB = (idxA + 1) % SHAPES.length;
      let blend = cyclePos - idxA;
      // Smooth Hermite Curve (Continuous smooth transition without stops)
      blend = blend * blend * (3 - 2 * blend);

      if (idxA !== currentIdxA) {
        currentIdxA = idxA;
        phaseBadge.innerText = SHAPES[idxA].name;
        createGentleWord(SHAPES[idxA].word);
      }

      const shapeA = SHAPES[idxA].data;
      const shapeB = SHAPES[idxB].data;

      // Update Particle Positions continuously & gently
      const posAttr = geometry.attributes.position;
      const pos = posAttr.array;

      const mouseWorldX = mouse.x * 150;
      const mouseWorldY = mouse.y * 110;

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;

        // Continuous interpolation between shape A and shape B
        let tx = shapeA[i3] * (1 - blend) + shapeB[i3] * blend;
        let ty = shapeA[i3 + 1] * (1 - blend) + shapeB[i3 + 1] * blend;
        let tz = shapeA[i3 + 2] * (1 - blend) + shapeB[i3 + 2] * blend;

        // Gentle mouse attraction
        const dx = mouseWorldX - pos[i3];
        const dy = mouseWorldY - pos[i3 + 1];
        const distSq = dx * dx + dy * dy;

        if (distSq < 14000) {
          const force = (1 - distSq / 14000) * 22;
          tx += (dx / 120) * force;
          ty += (dy / 120) * force;
        }

        // Silky smooth movement
        pos[i3] += (tx - pos[i3]) * 0.07;
        pos[i3 + 1] += (ty - pos[i3 + 1]) * 0.07;
        pos[i3 + 2] += (tz - pos[i3 + 2]) * 0.07;
      }
      posAttr.needsUpdate = true;

      // 3D Parallax & Gentle Breathing
      const breathing = 1.0 + Math.sin(now * 0.0016) * 0.05;
      particleSystem.rotation.y += 0.0025;
      particleSystem.rotation.y += (mouse.x * 0.3 - particleSystem.rotation.y) * 0.035;
      particleSystem.rotation.x += (-mouse.y * 0.22 - particleSystem.rotation.x) * 0.035;
      particleSystem.scale.set(breathing, breathing, breathing);

      renderer.render(scene, camera);
      render2D();
    }

    animate(performance.now());

    /* =====================================================================
       START INTERACTION
       ===================================================================== */
    const startScreen = document.getElementById('start-screen');

    function startApp() {
      audio.init();
      startScreen.classList.add('hidden');
      createGentleWord("VƯỜN HOA TÌNH YÊU 🌸");
    }

    startScreen.addEventListener('click', startApp);
    startScreen.addEventListener('touchstart', startApp);

    window.addEventListener('pointerdown', (e) => {
      if (!startScreen.classList.contains('hidden')) return;
      for (let i = 0; i < 12; i++) {
        spawnMouseBlossom(e.clientX, e.clientY);
      }
    });
  </script>
</body>
