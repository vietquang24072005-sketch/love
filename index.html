<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>COSMIC WOW ✨ PORSCHE 911 & GARDEN OF LIGHT</title>
  
  <meta property="og:title" content="Bản Giao Hưởng Bùng Nổ Thị Giác 3D 🌸🏎️💖">
  <meta property="og:description" content="Chạm để mở siêu phẩm thị giác: Porsche 911, Mắt đồng tử trái tim, Vườn hoa và nhịp đập âm nhạc bùng nổ!">
  <meta property="og:image" content="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=1200&q=80">
  <meta property="og:type" content="website">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030006;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      cursor: none;
    }

    /* Ambient Nebular Pulse */
    #ambient-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 120, 165, 0.22) 0%, rgba(180, 100, 255, 0.1) 45%, rgba(3, 0, 6, 0.98) 85%);
      z-index: 0;
      pointer-events: none;
      transition: opacity 0.1s ease;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #overlay-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Cinematic Flash Layer */
    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255, 200, 220, 0.8) 0%, rgba(255, 120, 180, 0.4) 60%, transparent 100%);
      opacity: 0;
      pointer-events: none;
      z-index: 8;
      transition: opacity 0.18s ease-out;
    }

    /* Cursor */
    #cursor-follower {
      position: fixed;
      top: 0;
      left: 0;
      width: 36px;
      height: 36px;
      margin-left: -18px;
      margin-top: -18px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 180, 210, 0.85);
      background: radial-gradient(circle, rgba(255, 180, 210, 0.4) 0%, rgba(220, 150, 255, 0.1) 70%, transparent 100%);
      box-shadow: 0 0 25px rgba(255, 120, 175, 0.8), 0 0 50px rgba(180, 100, 255, 0.5);
      pointer-events: none;
      z-index: 99;
      transform: translate3d(-100px, -100px, 0);
    }

    #cursor-dot {
      position: fixed;
      top: 0;
      left: 0;
      width: 6px;
      height: 6px;
      margin-left: -3px;
      margin-top: -3px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 15px #ff85b3, 0 0 25px #fff;
      pointer-events: none;
      z-index: 100;
      transform: translate3d(-100px, -100px, 0);
    }

    /* Start Overlay Screen */
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, rgba(30, 8, 35, 0.94) 0%, rgba(3, 0, 6, 0.98) 80%);
      backdrop-filter: blur(28px);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), visibility 1.2s;
      cursor: pointer;
    }
    #start-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .start-portal {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 26px;
    }

    .portal-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 160, 200, 0.7);
      box-shadow: 0 0 35px rgba(255, 120, 180, 0.5);
      animation: portalPulse 3s infinite ease-out;
    }
    .portal-ring:nth-child(2) {
      animation-delay: 1.2s;
      border-color: rgba(200, 140, 255, 0.5);
    }

    @keyframes portalPulse {
      0% { transform: scale(0.65); opacity: 0.95; }
      100% { transform: scale(2.6); opacity: 0; }
    }

    .portal-icon {
      font-size: 42px;
      animation: pulseCore 2.4s infinite ease-in-out;
      filter: drop-shadow(0 0 30px rgba(255, 120, 180, 1));
    }

    @keyframes pulseCore {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.22); opacity: 1; }
    }

    .start-prompt {
      color: #fff;
      font-size: 0.95rem;
      letter-spacing: 9px;
      text-transform: uppercase;
      font-weight: 300;
      text-shadow: 0 0 20px rgba(255, 160, 200, 0.9), 0 0 40px rgba(200, 140, 255, 0.6);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Audio Element (User's MP3) -->
  <audio id="bg-audio" src="music.mp3" loop preload="auto" playsinline></audio>

  <div id="ambient-glow"></div>
  <div id="flash-overlay"></div>

  <!-- Cursor Elements -->
  <div id="cursor-follower"></div>
  <div id="cursor-dot"></div>

  <!-- Canvases -->
  <canvas id="webgl-canvas"></canvas>
  <canvas id="overlay-canvas"></canvas>

  <!-- Start Screen -->
  <div id="start-screen">
    <div class="start-portal">
      <div class="portal-ring"></div>
      <div class="portal-ring"></div>
      <div class="portal-icon">🌸</div>
    </div>
    <div class="start-prompt">CHẠM ĐỂ MỞ</div>
  </div>

  <script>
    /* =====================================================================
       AUDIO BEAT DETECTOR (BASS DROP & PULSE SYNC)
       ===================================================================== */
    const audioElement = document.getElementById('bg-audio');
    let audioCtx = null;
    let analyser = null;
    let freqData = null;
    let beatEnergy = 0;
    let prevBeatEnergy = 0;

    function initAudio() {
      if (audioCtx) {
        audioElement.play().catch(e => console.log(e));
        return;
      }
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      freqData = new Uint8Array(analyser.frequencyBinCount);

      const source = audioCtx.createMediaElementSource(audioElement);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);

      audioElement.play().catch(e => console.log(e));
    }

    function updateBeat() {
      if (!analyser || !freqData) return;
      analyser.getByteFrequencyData(freqData);
      // Low bass frequencies (Sub & Kick drums)
      const lowBass = (freqData[1] + freqData[2] + freqData[3] + freqData[4]) / 4;
      beatEnergy = lowBass / 255; // 0.0 to 1.0

      // Bass Drop Detector
      if (beatEnergy - prevBeatEnergy > 0.28 && beatEnergy > 0.55) {
        triggerBassImpact();
      }
      prevBeatEnergy = beatEnergy;
    }

    const flashOverlay = document.getElementById('flash-overlay');
    const ambientGlow = document.getElementById('ambient-glow');

    function triggerBassImpact() {
      // Cinematic Flash & Camera Shake
      flashOverlay.style.opacity = '0.45';
      setTimeout(() => flashOverlay.style.opacity = '0', 160);

      ambientGlow.style.opacity = '1.3';
      setTimeout(() => ambientGlow.style.opacity = '1', 200);

      // Add a shockwave ring
      spawnShockwaveRing(0, 0, currentShapeIndex === 0 ? 'heart' : 'circle');
    }

    /* =====================================================================
       MOUSE INTERACTION
       ===================================================================== */
    const mouse = {
      x: 0,
      y: 0,
      targetX: 0,
      targetY: 0,
      screenX: window.innerWidth / 2,
      screenY: window.innerHeight / 2,
      targetScreenX: window.innerWidth / 2,
      targetScreenY: window.innerHeight / 2
    };

    const cursorFollower = document.getElementById('cursor-follower');
    const cursorDot = document.getElementById('cursor-dot');

    function onPointerMove(clientX, clientY) {
      mouse.targetScreenX = clientX;
      mouse.targetScreenY = clientY;
      mouse.targetX = (clientX / window.innerWidth) * 2 - 1;
      mouse.targetY = -(clientY / window.innerHeight) * 2 + 1;

      // Spawn glowing stardust
      spawnStardustTrail(clientX, clientY);
    }

    window.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    /* =====================================================================
       THREE.JS ENGINE: 9,500 HYPER-RADIANT PARTICLES
       ===================================================================== */
    const PARTICLE_COUNT = 9500;
    const canvas3D = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({
      canvas: canvas3D,
      antialias: true,
      alpha: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(56, window.innerWidth / window.innerHeight, 0.1, 3000);
    camera.position.z = 300;

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const velocities = new Float32Array(PARTICLE_COUNT * 3); // For explosive scatter
    const colors = new Float32Array(PARTICLE_COUNT * 3);

    for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 450;
      velocities[i] = (Math.random() - 0.5) * 4.0;
      colors[i] = 1.0;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    // Multi-layered High-Glow Stardust Texture
    function createGlowTexture() {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.18, 'rgba(255, 220, 235, 0.98)');
      grad.addColorStop(0.42, 'rgba(255, 140, 190, 0.65)');
      grad.addColorStop(0.72, 'rgba(200, 120, 255, 0.2)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    }

    const material = new THREE.PointsMaterial({
      size: 7.2,
      map: createGlowTexture(),
      vertexColors: true,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    /* =====================================================================
       3D PROCEDURAL SHOCKWAVE SYSTEM (EXPANDING RINGS)
       ===================================================================== */
    const shockwaveRings = [];
    const SHOCKWAVE_VERTS = 180;

    function createShockwaveRingGeometry() {
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(SHOCKWAVE_VERTS * 3);
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      return geo;
    }

    const ringMat = new THREE.LineBasicMaterial({
      color: 0xff85c0,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      linewidth: 2
    });

    for (let r = 0; r < 3; r++) {
      const ringMesh = new THREE.LineLoop(createShockwaveRingGeometry(), ringMat.clone());
      ringMesh.visible = false;
      scene.add(ringMesh);
      shockwaveRings.push({ mesh: ringMesh, radius: 0, maxRadius: 360, alpha: 0, type: 'circle' });
    }

    function spawnShockwaveRing(x = 0, y = 0, type = 'circle') {
      const ring = shockwaveRings.find(r => !r.mesh.visible);
      if (!ring) return;
      ring.mesh.position.set(x, y, 0);
      ring.radius = 10;
      ring.alpha = 0.95;
      ring.type = type;
      ring.mesh.visible = true;

      const posArr = ring.mesh.geometry.attributes.position.array;
      for (let i = 0; i < SHOCKWAVE_VERTS; i++) {
        const theta = (i / SHOCKWAVE_VERTS) * Math.PI * 2;
        let rx = Math.cos(theta);
        let ry = Math.sin(theta);
        if (type === 'heart') {
          // Heart-shaped shockwave
          rx = (16 * Math.pow(Math.sin(theta), 3)) / 16;
          ry = (13 * Math.cos(theta) - 5 * Math.cos(2*theta) - 2 * Math.cos(3*theta) - Math.cos(4*theta)) / 16;
        }
        posArr[i * 3] = rx * ring.radius;
        posArr[i * 3 + 1] = ry * ring.radius;
        posArr[i * 3 + 2] = 0;
      }
      ring.mesh.geometry.attributes.position.needsUpdate = true;
    }

    function updateShockwaves() {
      shockwaveRings.forEach(ring => {
        if (!ring.mesh.visible) return;
        ring.radius += 7.5;
        ring.alpha -= 0.022;

        if (ring.alpha <= 0 || ring.radius >= ring.maxRadius) {
          ring.mesh.visible = false;
          return;
        }

        ring.mesh.material.opacity = ring.alpha;
        const posArr = ring.mesh.geometry.attributes.position.array;
        for (let i = 0; i < SHOCKWAVE_VERTS; i++) {
          const theta = (i / SHOCKWAVE_VERTS) * Math.PI * 2;
          let rx = Math.cos(theta);
          let ry = Math.sin(theta);
          if (ring.type === 'heart') {
            rx = (16 * Math.pow(Math.sin(theta), 3)) / 16;
            ry = (13 * Math.cos(theta) - 5 * Math.cos(2*theta) - 2 * Math.cos(3*theta) - Math.cos(4*theta)) / 16;
          }
          posArr[i * 3] = rx * ring.radius;
          posArr[i * 3 + 1] = ry * ring.radius;
        }
        ring.mesh.geometry.attributes.position.needsUpdate = true;
      });
    }

    /* =====================================================================
       MATHEMATICAL MASTERPIECES (PORSCHE 911, VƯỜN HOA, MẮT TRÁI TIM, KIM CƯƠNG)
       ===================================================================== */
    const shapes = [];

    function addShape(fn) {
      const arr = new Float32Array(PARTICLE_COUNT * 3);
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = fn(i, i / PARTICLE_COUNT);
        const i3 = i * 3;
        arr[i3] = p[0];
        arr[i3 + 1] = p[1];
        arr[i3 + 2] = p[2];
      }
      shapes.push(arr);
    }

    /* 1. CON MẮT THẦN THOẠI & ĐỒNG TỬ HÌNH TRÁI TIM SIÊU THỰC */
    addShape((i, f) => {
      if (f < 0.32) {
        // Glowing Heart-Shaped Pupil in the core with volumetric corona
        const t = Math.PI * 2 * (f / 0.32);
        const r = Math.pow(Math.random(), 0.5) * 2.2;
        const x = 16 * Math.pow(Math.sin(t), 3) * r * 2.2;
        const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * r * 2.2;
        const z = (Math.random() - 0.5) * 14;
        return [x, y, z];
      } else if (f < 0.72) {
        // Concave 3D Iris with radiating fiber streamers
        const angle = Math.random() * Math.PI * 2;
        const radius = 34 + Math.random() * 58;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        const z = -Math.cos((radius / 92) * (Math.PI / 2)) * 32 + (Math.random() - 0.5) * 10;
        return [x, y, z];
      } else {
        // Almond Eyelids Contour & Royal Eyelash Filaments
        const width = 195;
        const x = (Math.random() - 0.5) * width * 2;
        const sign = Math.random() > 0.5 ? 1 : -1;
        const yBase = sign * 82 * Math.cos((x / (width * 2)) * Math.PI);
        const isLash = Math.random() > 0.3;
        const lashLen = isLash ? sign * (Math.random() * 32 + 12) : 0;
        const y = yBase + lashLen;
        const z = (Math.random() - 0.5) * 32;
        return [x, y, z];
      }
    });

    /* 2. SIÊU XE PORSCHE 911 COUPE 3D VỚI ĐÈN PHA LASER & ĐÈN HẬU LIỀN MẠCH */
    addShape((i, f) => {
      if (f < 0.16) {
        // 4 Glowing Wheels with Rims & Brake Calipers
        const wheelIdx = Math.floor(f / 0.04);
        const wx = (wheelIdx < 2) ? 100 : -95;
        const wz = (wheelIdx % 2 === 0) ? 62 : -62;
        const theta = Math.random() * Math.PI * 2;
        const wr = Math.random() * 26;
        return [wx + Math.cos(theta) * wr, -36 + Math.sin(theta) * wr, wz + (Math.random() - 0.5) * 10];
      } else if (f < 0.28) {
        // Twin Projector Laser Headlights (Beams of Light shooting forward!)
        const isRight = (i % 2 === 0);
        const hz = isRight ? 42 : -42;
        const beamDist = Math.random() * 160 + 135; // Light rays shooting forward in space
        const spread = (beamDist - 135) * 0.12;
        return [beamDist, -14 + (Math.random() - 0.5) * spread, hz + (Math.random() - 0.5) * spread];
      } else if (f < 0.38) {
        // Iconic 911 Continuous Rear LED Light Bar (Đèn hậu liền mạch vắt ngang đuôi)
        const z = (Math.random() - 0.5) * 110;
        const x = -158 + (Math.random() - 0.5) * 4;
        const y = 8 + (Math.random() - 0.5) * 5;
        return [x, y, z];
      } else if (f < 0.85) {
        // Masterpiece 911 Curved Flyline, Aerodynamic Hood & Widebody Haunches
        const x = (Math.random() - 0.5) * 315;
        const normX = x / 157.5; // -1 (Rear) to +1 (Front)

        let y = -30;
        let halfWidth = 56;

        if (normX > 0.52) {
          // Front hood curving down to bumper
          y = -14 - (normX - 0.52) * 36;
          halfWidth = 50 - (normX - 0.52) * 22;
        } else if (normX > -0.08) {
          // Windshield raking back to roof peak
          y = 42 - Math.pow(normX - 0.08, 2) * 48;
          halfWidth = 47;
        } else {
          // Legendary sloping teardrop rear to ducktail spoiler
          y = 42 + (normX + 0.08) * 44;
          halfWidth = 65; // Wide muscular rear Carrera haunches
        }

        const z = (Math.random() - 0.5) * 2 * halfWidth;
        y += (Math.random() - 0.5) * 8;
        return [x, y, z];
      } else {
        // Neon Underglow & Aerodynamic Streamers trailing backwards
        const x = (Math.random() - 0.5) * 310 - Math.random() * 80;
        const z = (Math.random() - 0.5) * 120;
        return [x, -44 + (Math.random() - 0.5) * 4, z];
      }
    });

    /* 3. VƯỜN HOA THIÊN ĐƯỜNG VỚI HÀNG CHỤC ĐÓA HOA VƯƠN CAO */
    addShape((i, f) => {
      const flowerIdx = i % 18;
      const angle = (flowerIdx / 18) * Math.PI * 2;
      const gardenR = 45 + (flowerIdx % 4) * 48;
      const stemBaseX = Math.cos(angle) * gardenR;
      const stemBaseZ = Math.sin(angle) * gardenR * 0.75;

      if (f < 0.32) {
        // Undulating luminous rolling flowerbed
        const gx = (Math.random() - 0.5) * 350;
        const gz = (Math.random() - 0.5) * 250;
        const gy = Math.sin(gx * 0.016) * 18 + Math.cos(gz * 0.02) * 15 - 68;
        return [gx, gy, gz];
      } else if (f < 0.62) {
        // Graceful flower stems rising up
        const prog = Math.random();
        const sx = stemBaseX + Math.sin(prog * Math.PI) * 16;
        const sy = -68 + prog * 92;
        const sz = stemBaseZ + (Math.random() - 0.5) * 6;
        return [sx, sy, sz];
      } else {
        // Blooming Petal Cups with swirling pollen halo
        const petT = Math.random() * Math.PI * 2;
        const petR = Math.random() * 28;
        const petalY = -68 + 92 + Math.pow(petR / 28, 1.3) * 18;
        return [stemBaseX + Math.cos(petT) * petR, petalY, stemBaseZ + Math.sin(petT) * petR];
      }
    });

    /* 4. TRÁI TIM KIM CƯƠNG VÔ CỰC VỚI VÒNG HÀO QUANG QUỸ ĐẠO */
    addShape((i, f) => {
      if (f < 0.78) {
        const t = Math.PI * 2 * (f / 0.78);
        const r = Math.pow(Math.random(), 0.52);
        const u = (Math.random() - 0.5) * Math.PI;
        const x = 16 * Math.pow(Math.sin(t), 3) * 8.8 * r;
        const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * 8.8 * r;
        const z = u * 18 * (1.1 - Math.abs(x) / 32);
        return [x, y, z];
      } else {
        // Double planetary rings of starlight orbiting the heart
        const theta = Math.random() * Math.PI * 2;
        const ringR = 175 + (Math.random() - 0.5) * 20;
        return [Math.cos(theta) * ringR, Math.sin(theta) * ringR * 0.45, Math.sin(theta) * ringR * 0.9];
      }
    });

    /* 5. CÁNH BƯỚM DẠ QUANG HUYỀN ẢO */
    addShape((i, f) => {
      const t = f * Math.PI * 2;
      const r = (Math.exp(Math.cos(t)) - 2 * Math.cos(4 * t) - Math.pow(Math.sin(t / 12), 5)) * 48;
      const x = r * Math.sin(t) * 0.98;
      const y = r * Math.cos(t) * 0.98;
      const z = Math.abs(x) * 0.42 + (Math.random() - 0.5) * 12;
      return [x, y, z];
    });

    /* =====================================================================
       HIGH-CONTRAST NEON PASTEL PALETTES
       ===================================================================== */
    const PALETTES = [
      // 0: Cyber Rose & Diamond (Con Mắt Trái Tim)
      { primary: [1.0, 0.65, 0.82], secondary: [1.0, 0.95, 0.98], accent: [0.95, 0.72, 1.0] },
      // 1: Electric Hot Pink & Ice Cyan (Porsche 911)
      { primary: [1.0, 0.45, 0.75], secondary: [0.55, 0.92, 1.0], accent: [1.0, 0.96, 0.75] },
      // 2: Spring Floral Blossom & Mint (Vườn Hoa)
      { primary: [1.0, 0.68, 0.82], secondary: [0.72, 0.98, 0.88], accent: [1.0, 0.88, 0.95] },
      // 3: Champagne Rose (Trái Tim Kim Cương)
      { primary: [1.0, 0.74, 0.82], secondary: [1.0, 0.92, 0.75], accent: [0.95, 0.82, 1.0] },
      // 4: Ethereal Ultraviolet (Cánh Bướm)
      { primary: [0.92, 0.65, 1.0], secondary: [0.75, 0.92, 1.0], accent: [1.0, 0.75, 0.90] }
    ];

    /* =====================================================================
       2D CANVAS: DELICATE SPARKS & SAKURA EMBER DRIFT
       ===================================================================== */
    const overlayCanvas = document.getElementById('overlay-canvas');
    const ctx2D = overlayCanvas.getContext('2d');

    function resizeCanvas() {
      overlayCanvas.width = window.innerWidth;
      overlayCanvas.height = window.innerHeight;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const stardustTrail = [];
    function spawnStardustTrail(x, y) {
      stardustTrail.push({
        x: x + (Math.random() - 0.5) * 16,
        y: y + (Math.random() - 0.5) * 16,
        vx: (Math.random() - 0.5) * 1.1,
        vy: -Math.random() * 1.4 - 0.4,
        size: Math.random() * 2.8 + 1.2,
        alpha: 0.95,
        char: Math.random() > 0.65 ? '✧' : (Math.random() > 0.5 ? '🌸' : null)
      });
      if (stardustTrail.length > 60) stardustTrail.shift();
    }

    function render2D() {
      ctx2D.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

      for (let i = stardustTrail.length - 1; i >= 0; i--) {
        const s = stardustTrail[i];
        s.x += s.vx;
        s.y += s.vy;
        s.alpha -= 0.015;

        if (s.alpha <= 0) {
          stardustTrail.splice(i, 1);
          continue;
        }

        ctx2D.save();
        ctx2D.globalAlpha = s.alpha;
        if (s.char) {
          ctx2D.font = '13px serif';
          ctx2D.fillStyle = '#ffccd8';
          ctx2D.fillText(s.char, s.x, s.y);
        } else {
          ctx2D.beginPath();
          ctx2D.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx2D.fillStyle = '#fff5f8';
          ctx2D.shadowColor = '#ff85b3';
          ctx2D.shadowBlur = 10;
          ctx2D.fill();
        }
        ctx2D.restore();
      }
    }

    /* =====================================================================
       CINEMATIC MORPHING WITH EXPLOSIVE SHOCKWAVE DISPERSAL & REFORM
       ===================================================================== */
    const TRANSITION_DURATION = 6.2; // 6.2s per shape
    let currentShapeIndex = 0;
    let lastTransitionTrigger = 0;
    const startTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);

      // Real-time Audio Sync
      updateBeat();
      updateShockwaves();

      // Smooth Cursor Movement
      mouse.screenX += (mouse.targetScreenX - mouse.screenX) * 0.085;
      mouse.screenY += (mouse.targetScreenY - mouse.screenY) * 0.085;
      mouse.x += (mouse.targetX - mouse.x) * 0.055;
      mouse.y += (mouse.targetY - mouse.y) * 0.055;

      cursorFollower.style.transform = `translate3d(${mouse.screenX}px, ${mouse.screenY}px, 0)`;
      cursorDot.style.transform = `translate3d(${mouse.targetScreenX}px, ${mouse.targetScreenY}px, 0)`;

      // Continuous Morph Calculation
      const elapsed = (now - startTime) * 0.001;
      const cyclePos = (elapsed / TRANSITION_DURATION) % shapes.length;
      const idxA = Math.floor(cyclePos);
      const idxB = (idxA + 1) % shapes.length;
      currentShapeIndex = idxA;

      let blend = cyclePos - idxA;

      // Detect shape boundary to trigger Supernova Blast!
      if (idxA !== lastTransitionTrigger) {
        lastTransitionTrigger = idxA;
        triggerBassImpact();
        // Give particles an outward explosive velocity blast
        const vel = geometry.attributes.position.array;
        for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
          velocities[i] = (Math.random() - 0.5) * 18.0;
        }
      }

      // Smooth Hermite blend
      const smoothBlend = blend * blend * (3 - 2 * blend);

      const shapeA = shapes[idxA];
      const shapeB = shapes[idxB];
      const pal = PALETTES[idxA % PALETTES.length];

      const pos = geometry.attributes.position.array;
      const col = geometry.attributes.color.array;

      const mouseWorldX = mouse.x * 145;
      const mouseWorldY = mouse.y * 110;

      // Porsche rotation / tilt
      const isPorsche = (idxA === 1 || idxB === 1);

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;

        let tx = shapeA[i3] * (1 - smoothBlend) + shapeB[i3] * smoothBlend;
        let ty = shapeA[i3 + 1] * (1 - smoothBlend) + shapeB[i3 + 1] * smoothBlend;
        let tz = shapeA[i3 + 2] * (1 - smoothBlend) + shapeB[i3 + 2] * smoothBlend;

        // When in Eye Shape (idx === 0), pupil dynamically tracks mouse!
        if (idxA === 0 || idxB === 0) {
          const eyeInfluence = (idxA === 0) ? (1 - smoothBlend) : smoothBlend;
          if (i < PARTICLE_COUNT * 0.32) { // Heart-shaped pupil
            tx += mouse.x * 24 * eyeInfluence;
            ty += mouse.y * 20 * eyeInfluence;
          }
        }

        // Apply explosive velocity dampening
        if (velocities[i3] !== 0) {
          tx += velocities[i3];
          ty += velocities[i3 + 1];
          tz += velocities[i3 + 2];
          velocities[i3] *= 0.88; // Quick decay
          velocities[i3 + 1] *= 0.88;
          velocities[i3 + 2] *= 0.88;
        }

        // Fluid mouse magnetic attraction
        const dx = mouseWorldX - pos[i3];
        const dy = mouseWorldY - pos[i3 + 1];
        const distSq = dx * dx + dy * dy;

        if (distSq < 14000) {
          const force = (1 - distSq / 14000) * 20;
          tx += (dx / 118) * force;
          ty += (dy / 118) * force;
        }

        // Viscous high-performance glide
        pos[i3] += (tx - pos[i3]) * 0.07;
        pos[i3 + 1] += (ty - pos[i3 + 1]) * 0.07;
        pos[i3 + 2] += (tz - pos[i3 + 2]) * 0.07;

        // Color blending with music beat intensity
        const f = i % 3;
        const c = (f === 0) ? pal.primary : (f === 1 ? pal.secondary : pal.accent);
        col[i3] += (c[0] - col[i3]) * 0.03;
        col[i3 + 1] += (c[1] - col[i3 + 1]) * 0.03;
        col[i3 + 2] += (c[2] - col[i3 + 2]) * 0.03;
      }

      geometry.attributes.position.needsUpdate = true;
      geometry.attributes.color.needsUpdate = true;

      // 3D Parallax + Music Beat FOV Punch!
      const audioPulse = beatEnergy * 0.12;
      const breathing = 1.0 + Math.sin(now * 0.0016) * 0.04 + audioPulse;

      // Camera FOV punch on bass drops
      camera.fov = 56 - beatEnergy * 5.5;
      camera.updateProjectionMatrix();

      // Dynamic rotation (Porsche spins gently to showcase the 3D profile)
      const baseRotY = isPorsche ? (now * 0.0008) : (now * 0.0004);
      particleSystem.rotation.y = baseRotY + mouse.x * 0.32;
      particleSystem.rotation.x = -mouse.y * 0.22;
      particleSystem.scale.set(breathing, breathing, breathing);

      renderer.render(scene, camera);
      render2D();
    }

    animate(performance.now());

    /* =====================================================================
       INTERACTION
       ===================================================================== */
    const startScreen = document.getElementById('start-screen');

    function startExperience() {
      initAudio();
      startScreen.classList.add('hidden');
      triggerBassImpact();
    }

    startScreen.addEventListener('click', startExperience);
    startScreen.addEventListener('touchstart', startExperience);

    window.addEventListener('pointerdown', (e) => {
      if (!startScreen.classList.contains('hidden')) return;
      triggerBassImpact();
      for (let i = 0; i < 12; i++) {
        spawnStardustTrail(e.clientX, e.clientY);
      }
    });
  </script>
</body>
</html>
